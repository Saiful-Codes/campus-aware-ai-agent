version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: campus_ai_postgres
    environment:
      POSTGRES_DB: campus_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  influxdb:
   image: influxdb:2.7
   container_name: campus_ai_influxdb
   restart: always
   ports:
    - "18086:8086"
   volumes:
    - influxdb_data:/var/lib/influxdb2
   environment:
    DOCKER_INFLUXDB_INIT_MODE: setup
    DOCKER_INFLUXDB_INIT_USERNAME: admin
    DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword123
    DOCKER_INFLUXDB_INIT_ORG: campus-ai
    DOCKER_INFLUXDB_INIT_BUCKET: sensor_data
    DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: campus-ai-token-123

volumes:
  postgres_data:
  influxdb_data: