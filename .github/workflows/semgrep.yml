name: Semgrep SAST

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  semgrep:
    name: Run Semgrep scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config auto


